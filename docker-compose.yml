services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mekakel
      POSTGRES_PASSWORD: mekakel
      POSTGRES_DB: mekakel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekakel -d mekakel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mekakel:mekakel@db:5432/mekakel
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      PORT: 3000
      TRUST_PROXY: "false"
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-no-reply@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-change-me}
      SMTP_FROM: "${SMTP_FROM:-MEKAKEL <no-reply@example.com>}"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
