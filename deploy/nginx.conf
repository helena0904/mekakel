map $http_x_forwarded_proto $mekakel_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $mekakel_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_for $mekakel_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mekakel_real_ip;
        proxy_set_header X-Forwarded-For $mekakel_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mekakel_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
